name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: src/data/budget.duckdb
          key: budget-db-${{ hashFiles('src/data/config.yaml') }}
          restore-keys: |
            budget-db-

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true  # Use binary packages from RStudio Package Manager

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ runner.os }}-${{ hashFiles('.github/R-packages.txt') }}
          restore-keys: |
            r-packages-${{ runner.os }}-

      - name: Install R packages
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")
          pak::pkg_install(c("readr", "tidyr", "dplyr", "purrr", "httr", "jsonlite", "lubridate", "DBI", "duckdb", "yaml"))
        shell: Rscript {0}

      - name: Check database status
        run: |
          cd src/data
          if [ ! -f "budget.duckdb" ]; then
            echo "No cached database found. Initializing from CSV files..."
            echo "This will take 2-5 minutes."
            Rscript init-db-from-csvs.R
          else
            echo "Using cached database ($(ls -lh budget.duckdb | awk '{print $5}'))"
            echo "Skipping data update on code-only deployments."
          fi
        env:
          TZ: UTC
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Generate Parquet files
        run: npm run generate-parquet
      
      - name: Build site
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
