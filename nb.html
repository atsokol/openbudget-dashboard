  <script id="1656" type="application/vnd.observable.javascript">
    function wfd_plot(data, title) {
      const 
        colorDomain = ["Increase", "Decrease", "Total"],
        colorRange = ["#649334", "#cc392b", "#1f77b4"];

      return Plot.plot({
        title: title,
        width: width,
        x: {
          align: 0,    
          round: false,
          domain: data.map(d => d.key)
        },
        y: {
          grid: true,
          nice: true,      
          label: "million UAH",      
          //tickFormat: d3.format(".2s")
        },
        color: {
          domain: colorDomain,
          range: colorRange
        },
        marks: [   
          Plot.barY(data, {
            x: "key",
            y1: "prior",
            y2: "accu",        
            fill: (d,i) => (i === 0 || i === data.length - 1) ? "Total": d.value >= 0 ? "Increase" : "Decrease",
            title: d => `${d.key}\nProfit: ${fmt(d.value)}\nRunning Total: ${fmt(d.accu)}`
          }),
          Plot.ruleY(data, {
            x1: "key",
            x2: "nextKey",
            y: "accu",        
            strokeDasharray: "1.5"
          }),
          Plot.ruleY([0], {strokeDasharray: "1.5"}),
          plotLabel(data.filter(d => d.value >= 0), -7),
          plotLabel(data.filter(d => d.value < 0), 7),
          Plot.axisX({label: null, lineWidth: 8.5, fontSize: 12, marginBottom: 70}),

        ]
      })

    }
  </script>

  <script id="2408" type="application/vnd.observable.javascript">
    data = {
      // Helper function to get the primary group code from ancestors 
      const aggData = (tab) => {
        return aq.from(tab)
          .filter(d => d.FUND_TYP == "T") 
          .groupby("CITY", "REP_PERIOD")
          .derive({value: d => d.FAKT_AMT / 1000000})
      };

      let inc_agg = aggData(inc)
        .rollup({income: op.sum("value")})

      let inc_curr_agg = aggData(curr_inc)
        .rollup({income_curr: op.sum("value")})


      let inc_core_agg = aggData(core_inc)
        .rollup({income_core: op.sum("value")})

      let inc_transfer_agg = aggData(transfer_inc)
        .rollup({income_transfers: op.sum("value")})

      let exp_agg = aggData(exp_e)
        .rollup({expense: op.sum("value")})

      let exp_curr_agg = aggData(curr_exp)
        .rollup({expense_curr: op.sum("value")})

      return inc_agg
        .join_left(inc_curr_agg)
        .join_left(inc_core_agg)
        .join_left(inc_transfer_agg)
        .join_left(exp_agg)
        .join_left(exp_curr_agg)
        .derive({curr_surplus: d => d.income_curr - d.expense_curr})
        .orderby("CITY", "REP_PERIOD")
        .objects()

    }
  </script>

  <script id="2324" type="application/vnd.observable.javascript">
    function get_treetab(data, c_table, codeString, adjust = false) {
       let data_select = data
          .filter(d => d.FUND_TYP == "T") 
          .filter(d => d.CITY == selectCity)
          .map(d => ({...d, 
                      value: d.FAKT_AMT / 1000000 / (adjust ? 2 : 1), // correcting the mistake of expense doubling in the program expense file
                      code: d[codeString],
                      YEAR: d.REP_PERIOD.getUTCFullYear(), 
                      MONTH: d.REP_PERIOD.getMonth() }))
          .filter(d => d.YEAR == selectYear)


      let data_transform = aq.from(data_select)
          .params({month_max: month_max})
          .filter(d => d.MONTH == month_max)
          .select("code", "value")
          .groupby("code")
          .rollup({value: op.sum("value")})
          .orderby("code")

      return aq.from(c_table)
        .join_left(data_transform, "code")
        .objects()

    }
  </script>

  <script id="1615" type="application/vnd.observable.javascript">
    // Transform data into format for waterfall chart

    function waterfall_diff(data, c_table, codeString, selectCat, adjust = false) {
      // Convert table with codes into a tree
      let c_tree = d3.stratify()
        .id((d) => d.code)
        .parentId((d) => d.parentCode)
        (c_table);

      // Extract nodes with primary codes 
      let c_leaves = c_tree.descendants().find(d => d.id == selectCat.code).copy().descendants();

      // Helper function to get the primary group code from ancestors 
      const getGroupCode = (node) => {
        const ancestor = node.ancestors().find(d => d.depth === 1);
        return ancestor ? ancestor.data.code : null;
      };

      // construct a mapping of primary codes to their group codes
      let codeMap = c_leaves.map(d => ({
        code: d.data.code, 
        groupCode: getGroupCode(d)
        // check if relevant node has an ancestor in the first level of aggregation
    }))

      // Filter and transform the `data` array
      let data_select = data
        .filter(d => d.FUND_TYP == "T") 
        .filter(d => d.CITY == selectCity)
        .map(d => ({...d, 
                    code: d[codeString],
                    YEAR: d.REP_PERIOD ? new Date(d.REP_PERIOD).getUTCFullYear() : null,
                    MONTH:d.REP_PERIOD ? new Date(d.REP_PERIOD).getUTCMonth() : null,
                   }))
        .filter(d => codeMap.map(D => D.code).includes(d.code))

      // Transform and aggregate data using Arquero
      let data_agg = aq.from(data_select)  
       .params({ selectYear: selectYear, baseYear: baseYear, selectCity: selectCity, month_max: month_max, adjust: adjust})
       .join_left(aq.from(codeMap), "code")  
      .derive({
        code: d => d.groupCode,  // code aggregation
        value: d => d.FAKT_AMT / 1000000 / (adjust ? 2 : 1)  // correcting the mistake of expense doubling in the program expense file
          })
      .select("CITY", "YEAR", "MONTH", "code", "value")
      .filter(d => d.YEAR == selectYear || d.YEAR == baseYear)
      .groupby("code", "YEAR", "CITY")
      .filter(d => d.MONTH == month_max)
      .rollup({value: op.sum("value")})
      .orderby("code")
      .join_left(aq.from(c_table), "code")

      // Calculate the sum by column for each year
      let sumByCol = data_agg
        .groupby("YEAR")
        .rollup({Total: op.sum("value")})
        .derive({Total_lag: op.lag("Total")})

      // Process the final array with labeled keys and accumulated values
      let arr = data_agg
      .groupby("code")
      .derive(({value_diff: d => d.value - op.lag(d.value)}))
      .groupby("YEAR")
      .pivot("name", "value_diff", {sort: false})
      .join_left(sumByCol, "YEAR")
      .filter(d => d.YEAR == selectYear)
      .relocate("Total_lag", {before: 1})
      .fold([aq.not("YEAR")])
      .derive({nextKey: d => op.lead(d.key),
                 accu: aq.rolling(d => op.sum(d.value))})
      .derive({accu: d => d.key == "Total" ? d.value : d.accu,
                 prior: d => d.key == "Total" ? 0 : op.lag(d.accu) ?? 0,})
      .objects()
      .map(d => ({...d,
                  key: d.key === "Total" ? 
                  `${selectCat.name} \n${month_max + 1}m ${selectYear}` : 
                      d.key === "Total_lag" ?
                      `${selectCat.name} \n${month_max + 1}m ${baseYear}` :
                      d.key
                  }))   // change labels to include relevant period

      return arr
    }
  </script>

  <script id="3251" type="application/vnd.observable.javascript">
    // Convert d3.hierarchy to a flat table format
    function hierarchyToTable(root) {
      // Initialize an empty array to hold the table data
      let table = [];

      // Use recursion or iteration to traverse the hierarchy
      root.each((node) => {
        // For each node, add an object to the table with the relevant properties
        table.push({
          code: node.data.code,               // Unique ID of the node
          name: node.data.name,            // Name or label of the node
          parentCode: node.parent ? node.parent.data.code : null, // ID of the parent node, or null if root
          // Add any other properties you need from node.data
        });
      });

      return table;
    }

  </script>
  <script id="3243" type="application/vnd.observable.javascript">
    function get_codes_ex(c_table, base_codes, exclude_codes = []) {
      let tree = d3.stratify()
        .id((d) => d.code)
        .parentId((d) => d.parentCode)
        (c_table);

      let tree_codes = [];  
      for (let code of base_codes) {
        let arr = tree.descendants().find(d => d.id == code).copy().descendants().map(d => ({code: d.data.code, name: d.data.name}))

        tree_codes = tree_codes.concat(arr)
      }

      let ex_codes = [];
      for (let code of exclude_codes) {
          let arr = tree.descendants().find(d => d.id == code).copy().descendants().map(d => d.data.code)
          ex_codes = ex_codes.concat(arr)
        }

      return tree_codes.filter(d => !ex_codes.includes(d.code))
    }
  </script>
